<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="50%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#A78BFA"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#A78BFA"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#1a1a2e" stroke="url(#g2)" stroke-width="1.5"/>
  <!-- 3 ascending bars -->
  <rect x="12" y="38" width="9" height="16" rx="2.5" fill="url(#g1)" opacity="0.55"/>
  <rect x="25" y="26" width="9" height="28" rx="2.5" fill="url(#g1)" opacity="0.78"/>
  <rect x="38" y="14" width="9" height="40" rx="2.5" fill="url(#g1)"/>
  <!-- Upward arrow from top bar -->
  <path d="M50 18 L54 8 L58 18" stroke="#A78BFA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- AI sparkle -->
  <circle cx="54" cy="8" r="3" fill="#C4B5FD"/>
  <circle cx="54" cy="8" r="5.5" fill="#A78BFA" opacity="0.18"/>

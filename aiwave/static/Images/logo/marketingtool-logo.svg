<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 48" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#A78BFA"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="50%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#A78BFA"/>
    </linearGradient>
  </defs>
  <!-- Icon: 3 ascending bars with AI sparkle -->
  <rect x="4" y="30" width="7" height="14" rx="2" fill="url(#grad2)" opacity="0.6"/>
  <rect x="15" y="20" width="7" height="24" rx="2" fill="url(#grad2)" opacity="0.8"/>
  <rect x="26" y="8" width="7" height="36" rx="2" fill="url(#grad2)"/>
  <!-- Upward arrow -->
  <path d="M36 12 L40 4 L44 12" stroke="url(#grad1)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- AI sparkle dot -->
  <circle cx="40" cy="4" r="2.5" fill="#A78BFA"/>
  <circle cx="40" cy="4" r="4.5" fill="#A78BFA" opacity="0.2"/>
  <!-- Text: MarketingTool -->
  <text x="52" y="34" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Marketing</text>
  <text x="204" y="34" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="url(#grad1)">Tool</text>
</svg>
